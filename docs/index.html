<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose a version</title>
<style>
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #4d4d4d;
        color: #dfdfdf;
        font-family: "Open Sans", "Noto Sans", system-ui, sans-serif;
    }
    main { width: min(520px, 92vw); }
    h1 { font-size: 28px; margin: 0 0 20px; }
    a.card {
        display: block;
        padding: 14px 20px;
        margin-bottom: 16px;
        background: #2f2f2f;
        border-radius: 4px;
        color: inherit;
        text-decoration: none;
    }
    a.card:hover { background: #3a3a3a; }
    a.card:active { background: #262626; }
    .name { font-size: 18px; font-weight: 600; }
    .desc { font-size: 14px; color: #9aa3b8 }
    .tag { color: #6fdc8c; font-size: 12px; margin-left: 8px; }
</style>
</head>
<body>
<main>
    <h1>Choose a version</h1>
    <a class="card" href="latest/">
        <div class="name">Latest</div>
        <div class="desc">The newest build.</div>
    </a>
    <div id="versions"></div>
</main>
<script>
    const OWNER = "LowPolyPhosphorus";
    const REPO = "mamdani-simulator";
    const PATH = "docs/version";
    const FALLBACK = ["1"];

    function addCard(name) {
        const a = document.creatElement("a");
        a.className = "card";
        a.href = "version/" + name + "/";
        const title = document.createElement("div");
        title.className = "name";
        title.textContent = "Version " + name;
        const dec = document.createElement("div");
        desc.className = "desc";
        desc.textContent = "Archived build.";
        const desc = document.createElement("div");
        desc.className = "desc";
        desc.textContent = "Archived build.";
        a.append(title, desc);
        document.getElementById("versions").appendChild(a);
    }

    async function loadVersions() {
        let names = FALLBACK;
        try {
            const r = await fetch("https://api.github.com/repos" + OWNER + "/" + REPO + "/contents" + PATH);
            if (!r.ok) throw new Error("HTTP " + r.status);
            const items = await r.json();
            names= items.filter(i => i.type === "dir").map(i => i.name);
        } catch (e) {
            console.warn("Version lookup failed, using fallback list.", e);
        }
        names.sort((a, b) => b.localeCompare(a, undefined, { numeric: true }));
        names.forEach(addCard); 
    }

loadVersions();
</script>
</body>
</html>
